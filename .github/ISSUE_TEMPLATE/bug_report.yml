name: Bug report
description: Something does not work as expected in the editor.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please check that the bug still happens on https://mayrik-p.github.io/TRV-Road-Tile-Editor/ after a full reload.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Choose Vendetta
        2. …
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari / Windows 11, Chrome
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
